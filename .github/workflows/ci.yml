name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Run Pytest
        run: |
          uv run --locked pytest --cov=src/zotero_arxiv_daily --cov-report=term-missing

  local-model:
    name: Verify real local Qwen inference
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CMAKE_ARGS: -DGGML_NATIVE=OFF
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-v1-${{ hashFiles('config/base.yaml') }}
          restore-keys: ${{ runner.os }}-hf-v1-
      - name: Generate a summary with the real GGUF model, without LLM API keys
        run: uv run --locked --extra local-llm scripts/check_local_llm.py
