name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.1.4

      - name: Run Pytest
        run: |
          uv run --locked pytest --cov=src/zotero_arxiv_daily --cov-report=term-missing

  local-model:
    name: Verify real local ${{ matrix.profile }} inference
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [qwen25, qwen35]
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CMAKE_ARGS: -DGGML_NATIVE=OFF
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-v1-${{ hashFiles('config/base.yaml') }}
          restore-keys: ${{ runner.os }}-hf-v1-
      - name: Generate a summary with the real GGUF model, without LLM API keys
        run: uv run --locked --extra local-llm scripts/check_local_llm.py --profile ${{ matrix.profile }}
      - name: Measure real CPU embeddings and cache reuse
        if: matrix.profile == 'qwen25'
        run: uv run --locked scripts/check_performance.py
