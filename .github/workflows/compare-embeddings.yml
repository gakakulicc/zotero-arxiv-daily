name: Compare real paper selections
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/compare_rankings.py
      - .github/workflows/compare-embeddings.yml

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Prepare temporary experiment directory
        run: echo "COMPARISON_DIR=$RUNNER_TEMP/ranking-comparison" >> "$GITHUB_ENV"
      - name: Cache public model weights
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-comparison-models-v1
          restore-keys: ${{ runner.os }}-hf-v1-
      - name: Freeze real Zotero and feed snapshot (no email)
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          uv run --locked scripts/compare_rankings.py snapshot --directory "$COMPARISON_DIR"
      - name: Rank with GIST-small (512 tokens)
        run: uv run --locked scripts/compare_rankings.py gist512 --directory "$COMPARISON_DIR"
      - name: Rank with Jina (matched 512-token limit)
        run: uv run --locked scripts/compare_rankings.py jina512 --directory "$COMPARISON_DIR"
      - name: Check Jina full-context selection (8192 tokens)
        run: uv run --locked scripts/compare_rankings.py jina8192 --directory "$COMPARISON_DIR"
      - name: Compare top selections and create blind review sheet
        run: uv run --locked scripts/compare_rankings.py report --directory "$COMPARISON_DIR"
      - name: Upload comparison report (no library text or credentials)
        uses: actions/upload-artifact@v7
        with:
          name: real-paper-selection-comparison
          path: ${{ runner.temp }}/ranking-comparison/report
          retention-days: 14
