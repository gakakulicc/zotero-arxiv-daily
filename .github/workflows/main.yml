name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      force_send_empty:
        description: Send a confirmation email even when no new papers are available
        type: boolean
        default: true
  schedule:
    - cron: '0 22 * * *'
    - cron: '17 0 * * *' # Retry slot: skip when today's scheduled digest already reached SMTP.

permissions:
  contents: read

concurrency:
  group: daily-digest-${{ github.repository }}
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CMAKE_ARGS: -DGGML_NATIVE=OFF
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show code version
        run: |
          revision=$(git rev-parse HEAD)
          printf 'Checked-out revision: %s\nRun attempt: %s\n' "$revision" "$GITHUB_RUN_ATTEMPT"
          printf '## Code version\n\n- Commit: `%s`\n- Run attempt: %s\n' "$revision" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-v1-${{ hashFiles('config/base.yaml') }}
          restore-keys: ${{ runner.os }}-hf-v1-

      - name: Cache computed embeddings
        uses: actions/cache@v5
        with:
          path: .cache/embeddings
          key: ${{ runner.os }}-embeddings-v1-${{ hashFiles('config/base.yaml', 'uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-embeddings-v1-${{ hashFiles('config/base.yaml', 'uv.lock') }}-

      - name: Restore completed summaries and delivery markers
        uses: actions/cache/restore@v5
        with:
          path: .cache/digests
          key: ${{ runner.os }}-digest-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-digest-state-v2-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          MAX_PAPER_NUM: ${{ secrets.MAX_PAPER_NUM }}
          USE_LLM_API: ${{ secrets.USE_LLM_API }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY || 'true' }}
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          FORCE_SEND_EMPTY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send_empty && 'true' || 'false' }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          if [ "$FORCE_SEND_EMPTY" = "true" ]; then
            export SEND_EMPTY=true
          fi
          uv run --locked --extra local-llm src/zotero_arxiv_daily/main.py

      - name: Save completed work even if delivery failed
        if: always() && hashFiles('.cache/digests/**') != ''
        uses: actions/cache/save@v5
        with:
          path: .cache/digests
          key: ${{ runner.os }}-digest-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve rendered digest and delivery status
        if: always() && hashFiles('.cache/delivery/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: daily-delivery-report
          path: .cache/delivery
          retention-days: 14
