name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      force_send_empty:
        description: Send a confirmation email even when no new papers are available
        type: boolean
        default: true
  schedule:
    - cron: '0 21 * * *' # 05:00 Asia/Shanghai on the following UTC date.
    - cron: '0 2 * * *' # 10:00 Asia/Shanghai; skip an already delivered digest.

permissions:
  contents: read
  actions: read

concurrency:
  group: daily-digest-${{ github.repository }}
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CMAKE_ARGS: -DGGML_NATIVE=OFF
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show code version
        run: |
          revision=$(git rev-parse HEAD)
          printf 'Checked-out revision: %s\nRun attempt: %s\n' "$revision" "$GITHUB_RUN_ATTEMPT"
          printf '## Code version\n\n- Commit: `%s`\n- Run attempt: %s\n' "$revision" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"

      - name: Determine minimum retry interval
        if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * *'
        id: retry-interval
        uses: actions/github-script@v9
        with:
          script: |
            const repo = context.repo;
            const {data: current} = await github.rest.actions.getWorkflowRun({...repo, run_id: context.runId});
            const beijingDay = value => new Date(Date.parse(value) + 8 * 3600000).toISOString().slice(0, 10);
            const day = beijingDay(current.created_at);
            const {data} = await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: current.workflow_id, event: 'schedule',
              created: `>=${new Date(Date.parse(`${day}T00:00:00+08:00`)).toISOString()}`, per_page: 100
            });
            const previous = data.workflow_runs
              .filter(run => run.id !== current.id && run.created_at < current.created_at && beijingDay(run.created_at) === day)
              .sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
            let seconds = 0;
            if (previous) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...repo, run_id: previous.id, per_page: 100
              });
              const step = jobs.flatMap(job => job.steps || []).find(step => step.name === 'Run script' && step.started_at);
              const started = Date.parse(step?.started_at || previous.run_started_at);
              if (!Number.isFinite(started)) throw new Error('Cannot determine the previous scheduled start time');
              seconds = Math.max(0, Math.ceil((started + 5 * 3600000 - Date.now()) / 1000));
              core.info(`Previous scheduled run: ${previous.id}; retry delay: ${seconds}s`);
            }
            core.setOutput('seconds', seconds);

      - name: Respect five hours between scheduled attempts
        if: steps.retry-interval.outputs.seconds != '' && steps.retry-interval.outputs.seconds != '0'
        env:
          RETRY_DELAY_SECONDS: ${{ steps.retry-interval.outputs.seconds }}
        run: sleep "$RETRY_DELAY_SECONDS"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-hf-v1-${{ hashFiles('config/base.yaml') }}
          restore-keys: ${{ runner.os }}-hf-v1-

      - name: Cache computed embeddings
        uses: actions/cache@v5
        with:
          path: .cache/embeddings
          key: ${{ runner.os }}-embeddings-v1-${{ hashFiles('config/base.yaml', 'uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-embeddings-v1-${{ hashFiles('config/base.yaml', 'uv.lock') }}-

      - name: Restore completed summaries and delivery markers
        uses: actions/cache/restore@v5
        with:
          path: .cache/digests
          key: ${{ runner.os }}-digest-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ runner.os }}-digest-state-v2-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          MAX_PAPER_NUM: ${{ secrets.MAX_PAPER_NUM }}
          USE_LLM_API: ${{ secrets.USE_LLM_API }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          ZOTERO_IGNORE: ${{ vars.ZOTERO_IGNORE }}
          SEND_EMPTY: ${{ vars.SEND_EMPTY || 'true' }}
          LLM_BACKEND: ${{ vars.LLM_BACKEND }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          FORCE_SEND_EMPTY: ${{ github.event_name == 'workflow_dispatch' && inputs.force_send_empty && 'true' || 'false' }}
        run: |
          if [ -n "$CUSTOM_CONFIG" ]; then
            printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          fi
          if [ "$FORCE_SEND_EMPTY" = "true" ]; then
            export SEND_EMPTY=true
          fi
          uv run --locked --extra local-llm src/zotero_arxiv_daily/main.py

      - name: Save completed work even if delivery failed
        if: always() && hashFiles('.cache/digests/**') != ''
        uses: actions/cache/save@v5
        with:
          path: .cache/digests
          key: ${{ runner.os }}-digest-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve rendered digest and delivery status
        if: always() && hashFiles('.cache/delivery/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: daily-delivery-report
          path: .cache/delivery
          retention-days: 14
